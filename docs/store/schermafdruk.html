<!doctype html>
<meta charset="utf-8">
<title>Schermafdruk voor de Web Store</title>
<!--
  Zet het paneel op 1280x800, de maat die de Chrome Web Store vraagt. Het
  paneel zelf is 420 px breed; los op een frame van 1280 zou het een streepje
  in de hoek zijn.

  Draaien vanuit de wortel van de repo:
    python3 -m http.server 8765
    http://localhost:8765/docs/store/schermafdruk.html?scherm=klaar

  De schermen zijn: kind-kiezen, klaar, bezig, gereed. Het paneel staat in de
  demostand, dus met verzonnen namen en zonder Magister of rekenmachine.
-->
<style>
  :root { --blauw: #0B6BB5; --diep: #08375C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    display: flex; align-items: center; gap: 64px; padding: 0 88px;
    background: linear-gradient(135deg, #EAF3FB 0%, #D6E7F6 100%);
    font: 400 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    color: var(--diep);
  }
  .tekst { width: 470px; flex: none; }
  h1 { font-size: 46px; line-height: 1.12; margin: 0 0 20px; letter-spacing: -0.02em; }
  p { font-size: 20px; margin: 0 0 28px; color: #274B68; }
  ul { margin: 0; padding: 0; list-style: none; font-size: 18px; }
  li { padding: 7px 0 7px 30px; position: relative; }
  li::before {
    content: ""; position: absolute; left: 4px; top: 15px;
    width: 9px; height: 9px; border-radius: 999px; background: var(--blauw);
  }
  .venster {
    flex: none; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 26px 60px rgba(8, 55, 92, 0.22),
                0 3px 10px rgba(8, 55, 92, 0.10);
  }
  .venster iframe { display: block; border: 0; transform-origin: top left; }
</style>
<div class="tekst">
  <h1 id="kop"></h1>
  <p id="onder"></p>
  <ul id="punten"></ul>
</div>
<div class="venster" id="venster"><iframe id="paneel"></iframe></div>
<script>
  // Per scherm: de kop, de regel eronder, de opsomming, en hoe hoog het
  // paneel op dat scherm is. Die hoogte is gemeten, niet geraden -- een
  // iframe rekt niet mee met zijn inhoud.
  const SCHERMEN = {
    klaar: {
      kop: 'Je rooster op je rekenmachine',
      onder: 'Een klik, en het rooster van vier weken plus de cijferlijst van '
        + 'dit schooljaar staan erop.',
      punten: ['Leest je eigen, ingelogde Magister-tab',
        'Verstuurt over de USB-kabel', 'Werkt daarna zonder internet'],
    },
    'kind-kiezen': {
      kop: 'Voor wie is deze rekenmachine?',
      onder: 'Heb je als ouder meer dan een kind, dan kies je er hier een. '
        + 'Die keuze wordt onthouden.',
      punten: ['Eenmalig kiezen', 'Per rekenmachine een kind',
        'Later te wijzigen met een knop'],
    },
    bezig: {
      kop: 'Versturen duurt een paar tellen',
      onder: 'De app en de gegevens gaan als twee programma’s naar het '
        + 'apparaat, met een voortgangsbalk erbij.',
      punten: ['Afbreken kan altijd', 'Stopt netjes op een pakketgrens',
        'Geen half programma op het apparaat'],
    },
    gereed: {
      kop: 'Klaar, met een samenvatting',
      onder: 'Hoeveel lessen en cijfers erop staan, en tot welke dag het '
        + 'rooster reikt.',
      punten: ['Rooster van vier weken', 'Cijfers van dit schooljaar',
        'Huiswerk en mededelingen per les'],
    },
  };

  const naam = new URLSearchParams(location.search).get('scherm') || 'klaar';
  const s = SCHERMEN[naam] || SCHERMEN.klaar;
  const SCHAAL = 1.32;

  document.getElementById('kop').textContent = s.kop;
  document.getElementById('onder').textContent = s.onder;
  document.getElementById('punten').innerHTML =
    s.punten.map((p) => `<li>${p}</li>`).join('');

  const paneel = document.getElementById('paneel');
  const venster = document.getElementById('venster');
  venster.style.width = `${Math.round(420 * SCHAAL)}px`;
  paneel.width = 420;
  paneel.style.transform = `scale(${SCHAAL})`;

  // De hoogte per scherm meten in plaats van hem hier op te schrijven: een
  // opgeschreven hoogte loopt achter zodra er een regel tekst bij komt, en dat
  // zie je pas terug als een strook leegte onder de knoppen.
  paneel.addEventListener('load', () => {
    const doc = paneel.contentDocument;
    const hoog = Math.ceil(doc.documentElement.getBoundingClientRect().height);
    paneel.height = hoog;
    venster.style.height = `${Math.round(hoog * SCHAAL)}px`;
    document.title = `klaar: ${naam} (${hoog}px)`;
  });
  paneel.src = `/extension/panel.html?scherm=${encodeURIComponent(naam)}`;
</script>
