<!doctype html>
<meta charset="utf-8">
<title>Schermafdruk voor de Web Store</title>
<!--
  Zet het paneel of een foto op 1280x800, de maat die de Chrome Web Store
  vraagt. Het paneel zelf is 420 px breed; los op een frame van 1280 zou het
  een streepje in de hoek zijn.

  Draaien vanuit de wortel van de repo:
    python3 -m http.server 8765
    http://localhost:8765/docs/store/schermafdruk.html?scherm=klaar

  De schermen staan hieronder in SCHERMEN. Het paneel draait in de demostand,
  dus met verzonnen namen en zonder Magister of rekenmachine.
-->
<style>
  :root { --blauw: #0B6BB5; --diep: #08375C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    display: flex; align-items: center; gap: 64px; padding: 0 88px;
    background: linear-gradient(135deg, #EAF3FB 0%, #D6E7F6 100%);
    font: 400 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    color: var(--diep);
  }
  .tekst { width: 470px; flex: none; }
  h1 { font-size: 46px; line-height: 1.12; margin: 0 0 20px; letter-spacing: -0.02em; }
  p { font-size: 20px; margin: 0 0 28px; color: #274B68; }
  ul { margin: 0; padding: 0; list-style: none; font-size: 18px; }
  li { padding: 7px 0 7px 30px; position: relative; }
  li::before {
    content: ""; position: absolute; left: 4px; top: 15px;
    width: 9px; height: 9px; border-radius: 999px; background: var(--blauw);
  }
  .venster {
    flex: none; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 26px 60px rgba(8, 55, 92, 0.22),
                0 3px 10px rgba(8, 55, 92, 0.10);
  }
  .venster iframe { display: block; border: 0; transform-origin: top left; }
  /* Een staande foto in een liggend frame: cover snijdt de randen weg,
     object-position bepaalt welk stuk je overhoudt. */
  .venster img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
<div class="tekst">
  <h1 id="kop"></h1>
  <p id="onder"></p>
  <ul id="punten"></ul>
</div>
<div class="venster" id="venster"></div>
<script>
  // Elk scherm is een kop, een regel eronder en drie punten. Geschreven voor
  // iemand die de extensie nog niet kent en zich afvraagt wat hij eraan heeft
  // -- niet voor iemand die wil weten hoe hij werkt.
  const SCHERMEN = {
    klaar: {
      kop: 'Je rooster in de les, zonder je telefoon',
      onder: 'Op steeds meer scholen moet je telefoon de klas uit. Je grafische '
        + 'rekenmachine niet, en die heb je toch al bij je.',
      punten: ['Welk uur, welk lokaal, welke docent',
        'Het huiswerk staat erbij', 'Geen wifi nodig'],
    },
    foto: {
      kop: 'Zo staat het op je scherm',
      onder: 'Aanzetten en je dag staat er. Geen menu’s, geen laadtijd, geen '
        + 'internet.',
      punten: ['Bladeren met de pijltjes',
        'ENTER voor het huiswerk bij een les', '2 voor je cijfers'],
      foto: 'foto-apparaat.jpg',
      // Het kader is liggender dan de staande foto, zodat de toetsen onderaan
      // wegvallen en het schermpje overblijft. uitsnede bepaalt welk stuk.
      kader: [520, 480],
      uitsnede: 'center 5%',
    },
    gereed: {
      kop: 'Vier weken vooruit, en al je cijfers',
      onder: 'Een klik en een paar tellen later staat alles erop. Daarna werkt '
        + 'het de hele dag zonder internet.',
      punten: ['Uitval en wijzigingen zie je meteen',
        'Cijfers per vak, met het gemiddelde',
        'Blijft staan tot je opnieuw synct'],
    },
    'kind-kiezen': {
      kop: 'Twee kinderen, twee rekenmachines',
      onder: 'Log in met je eigen ouderaccount en kies wie deze rekenmachine '
        + 'krijgt. Dat hoef je maar een keer te doen.',
      punten: ['Werkt net zo goed op een leerlingaccount',
        'Je hoeft nergens opnieuw in te loggen',
        'Alleen dat kind gaat mee de kabel in'],
    },
  };

  const naam = new URLSearchParams(location.search).get('scherm') || 'klaar';
  const s = SCHERMEN[naam] || SCHERMEN.klaar;
  const SCHAAL = 1.32;

  document.getElementById('kop').textContent = s.kop;
  document.getElementById('onder').textContent = s.onder;
  document.getElementById('punten').innerHTML =
    s.punten.map((p) => `<li>${p}</li>`).join('');

  const venster = document.getElementById('venster');

  if (s.foto) {
    const [breed, hoog] = s.kader || [520, 620];
    venster.style.width = `${breed}px`;
    venster.style.height = `${hoog}px`;
    const img = document.createElement('img');
    img.style.objectPosition = s.uitsnede || 'center';
    img.addEventListener('load', () => { document.title = `klaar: ${naam}`; });
    img.src = s.foto;
    venster.append(img);
  } else {
    const paneel = document.createElement('iframe');
    venster.style.width = `${Math.round(420 * SCHAAL)}px`;
    paneel.width = 420;
    paneel.style.transform = `scale(${SCHAAL})`;
    // De hoogte per scherm meten in plaats van hem hier op te schrijven: een
    // opgeschreven hoogte loopt achter zodra er een regel tekst bij komt, en
    // dat zie je pas terug als een strook leegte onder de knoppen.
    paneel.addEventListener('load', () => {
      const doc = paneel.contentDocument;
      const hoog = Math.ceil(doc.documentElement.getBoundingClientRect().height);
      paneel.height = hoog;
      venster.style.height = `${Math.round(hoog * SCHAAL)}px`;
      document.title = `klaar: ${naam} (${hoog}px)`;
    });
    paneel.src = `/extension/panel.html?scherm=${encodeURIComponent(naam)}`;
    venster.append(paneel);
  }
</script>
